<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AllShield AHU | TM Technics BOM</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    function resizeFragment(frame, reportedHeight) {
      let height = reportedHeight;
      if (!Number.isFinite(height)) {
        try {
          const documentRoot = frame.contentDocument;
          height = Math.max(
            documentRoot.body.scrollHeight,
            documentRoot.body.offsetHeight
          );
        } catch (error) {
          return;
        }
      }
      frame.style.height = Math.max(88, Math.ceil(height)) + "px";
    }

    window.addEventListener("message", (event) => {
      const message = event.data;
      if (!message || message.type !== "tiiny-fragment-height") {
        return;
      }
      const frame = document.querySelector('[data-fragment="' + message.fragment + '"]');
      if (frame) {
        resizeFragment(frame, message.height);
      }
    });

    window.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll(".right-fragment").forEach((frame) => {
        frame.addEventListener("load", () => resizeFragment(frame));
      });
    });
  </script>
</head>
<body>
  <header class="site-header">
    <p>AllShield AHU</p>
    <h1>TM Technics materiaalstaat</h1>
  </header>

  <div class="site-layout">
    <aside class="left-pane" aria-label="Subassemblies">
      <iframe class="left-navigation" src="leftpane.html" title="Navigatie subassemblies"></iframe>
    </aside>

    <main class="right-pane" aria-label="Subassembly materiaalstaten">
      <div id="subassembly-A" class="fragment-slot"><iframe class="right-fragment" src="rightpane_A.html" data-fragment="rightpane_A.html" title="AHU A — Inlet Window to Filter Plenum"></iframe></div>
